    // ==========================================
    // 2. FINANCIAL CALCULATIONS & FORMATTING
    // ==========================================
    function calculateHoldingsValue(holdings, stockMap) {
      return holdings.reduce((sum, h) => {
        const s = stockMap[h.symbol] || { price: h.avgPurchasePrice };
        return sum + (h.shares * s.price);
      }, 0);
    }

    function calculateTotalInvested(holdings) {
      return holdings.reduce((sum, h) => sum + (h.totalCostBasis || (h.shares * h.avgPurchasePrice)), 0);
    }

    function calculateAssetAllocation(holdings, stockMap, cash) {
      const sectorTotals = {};
      let totalHoldingsVal = 0;

      holdings.forEach(h => {
        const s = stockMap[h.symbol] || { sector: 'Other', price: h.avgPurchasePrice };
        const val = h.shares * s.price;
        const sec = s.sector || 'Other';
        sectorTotals[sec] = (sectorTotals[sec] || 0) + val;
        totalHoldingsVal += val;
      });

      const totalEquity = totalHoldingsVal + cash;
      if (totalEquity <= 0) return [];

      const colors = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#0284c7', '#dc2626'];
      const result = [];
      let cIdx = 0;

      for (const [sec, amt] of Object.entries(sectorTotals)) {
        result.push({
          name: sec,
          amount: amt,
          percentage: Number(((amt / totalEquity) * 100).toFixed(1)),
          color: colors[cIdx % colors.length]
        });
        cIdx++;
      }

      if (cash > 0) {
        result.push({
          name: 'Cash Reserves',
          amount: cash,
          percentage: Number(((cash / totalEquity) * 100).toFixed(1)),
          color: '#64748b'
        });
      }

      return result.sort((a, b) => b.amount - a.amount);
    }

    function formatCurrency(amount, currency = 'INR') {
      const num = Number(amount) || 0;
      if (currency === 'USD') {
        const usdVal = num / 83.5;
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(usdVal);
      }
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2 }).format(num);
    }

    function formatPercent(val) {
      const num = Number(val) || 0;
      return `${num >= 0 ? '+' : ''}${num.toFixed(2)}%`;
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getMarketStatus() {
      const now = new Date();
      const istString = now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
      const istDate = new Date(istString);
      const day = istDate.getDay();
      const hour = istDate.getHours();
      const min = istDate.getMinutes();
      const currentMin = hour * 60 + min;

      const isWeekday = day >= 1 && day <= 5;
      const isOpen = isWeekday && currentMin >= (9 * 60 + 15) && currentMin <= (15 * 60 + 30);

      return {
        isOpen,
        label: isOpen ? 'Market Open (09:15 - 15:30 IST)' : 'Market Closed (Opens 09:15 IST)',
        note: 'National Stock Exchange (NSE) standard trading hours'
      };
    }

      const [compareModalOpen, setCompareModalOpen] = useState(false);
      const [compareSymbols, setCompareSymbols] = useState(['RELIANCE', 'TCS', 'HDFCBANK']);
      const [resetModal, setResetModal] = useState(null);
      const [toasts, setToasts] = useState([]);

      const addToast = (type, title, message) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, type, title, message }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);

      // Sync theme with body
      useEffect(() => {
        document.body.className = theme === 'dark' ? 'dark-theme' : 'light-theme';
        localStorage.setItem('stockwise_theme', theme);

      useEffect(() => {
        localStorage.setItem('stockwise_currency', currency);
      }, [currency]);

      useEffect(() => {
        try {
          localStorage.setItem('stockwise_portfolio', JSON.stringify(portfolio));
        } catch(e) {}
      }, [portfolio]);

      // Financial Metrics
      const holdings = portfolio.holdings || [];
      const cashBalance = portfolio.cashBalance || 0;
      const initialCapital = portfolio.initialCapital || 100000;
      const transactions = portfolio.transactions || [];
      const watchlist = portfolio.watchlist || [];
      const realizedProfitLoss = portfolio.realizedProfitLoss || 0;

      const holdingsMap = useMemo(() => Object.fromEntries(holdings.map(h => [h.symbol, h])), [holdings]);
      const totalHoldingsValue = useMemo(() => calculateHoldingsValue(holdings, STOCK_MAP), [holdings]);
      const totalInvested = useMemo(() => calculateTotalInvested(holdings), [holdings]);
      const totalEquity = cashBalance + totalHoldingsValue;
      const unrealizedPL = totalHoldingsValue - totalInvested;
      const overallReturnPct = initialCapital > 0 ? ((totalEquity - initialCapital) / initialCapital) * 100 : 0;
      const market = getMarketStatus();

      // BUY Order Execution
      const handleExecuteBuy = (stock, shares) => {
        const fee = 20.00;
        const cost = (shares * stock.price) + fee;

        if (cost > cashBalance) {
          addToast('error', 'Insufficient Cash', 'You do not have enough cash to complete this purchase.');
          return;
        }

        const newCash = Number((cashBalance - cost).toFixed(2));
        let updatedHoldings = [...holdings];
        const existingIndex = updatedHoldings.findIndex(h => h.symbol === stock.symbol);

        if (existingIndex >= 0) {
          const ex = updatedHoldings[existingIndex];
          const newTotalShares = ex.shares + shares;
          const newAvgPrice = ((ex.shares * ex.avgPurchasePrice) + (shares * stock.price)) / newTotalShares;
          updatedHoldings[existingIndex] = {
            ...ex,
            shares: newTotalShares,
            avgPurchasePrice: Number(newAvgPrice.toFixed(2)),
            totalCostBasis: Number((newTotalShares * newAvgPrice).toFixed(2))
          };
        } else {
          updatedHoldings.push({
            symbol: stock.symbol,
            name: stock.name,
            shares,
            avgPurchasePrice: stock.price,
            totalCostBasis: Number((shares * stock.price).toFixed(2))
          });
        }

        const newTransaction = {
          id: `TXN-${Math.floor(10000 + Math.random() * 90000)}`,
          date: new Date().toISOString(),
          symbol: stock.symbol,
          name: stock.name,
          type: 'BUY',
          shares,
          price: stock.price,
          fees: fee,
          totalAmount: cost,
          status: 'EXECUTED'
        };

        setPortfolio({
          ...portfolio,
          cashBalance: newCash,
          holdings: updatedHoldings,
          transactions: [newTransaction, ...transactions]
        });

        addToast('success', 'Order Executed', `Purchased ${shares} shares of ${stock.symbol}.`);
        setTradeModal({ isOpen: false, mode: 'BUY', stock: null });
      };

      // SELL Order Execution
      const handleExecuteSell = (stock, shares) => {
        const fee = 20.00;
        const grossProceeds = shares * stock.price;
        const netProceeds = Math.max(0, grossProceeds - fee);

        const existingIndex = holdings.findIndex(h => h.symbol === stock.symbol);
        if (existingIndex < 0 || holdings[existingIndex].shares < shares) {
          addToast('error', 'Invalid Sell Order', 'You cannot sell more shares than you own.');
          return;
        }

        const ex = holdings[existingIndex];
        const realizedGain = (shares * (stock.price - ex.avgPurchasePrice)) - fee;
        const newCash = Number((cashBalance + netProceeds).toFixed(2));
        const newRealizedPL = Number((realizedProfitLoss + realizedGain).toFixed(2));

        let updatedHoldings = [...holdings];
        const remainingShares = ex.shares - shares;

        if (remainingShares === 0) {
          updatedHoldings.splice(existingIndex, 1);
        } else {
          updatedHoldings[existingIndex] = {
            ...ex,
            shares: remainingShares,
            totalCostBasis: Number((remainingShares * ex.avgPurchasePrice).toFixed(2))
          };
        }

        const newTransaction = {
          id: `TXN-${Math.floor(10000 + Math.random() * 90000)}`,
          date: new Date().toISOString(),
          symbol: stock.symbol,
          name: stock.name,
          type: 'SELL',
          shares,
          price: stock.price,
          fees: fee,
          totalAmount: netProceeds,
          realizedGain: Number(realizedGain.toFixed(2)),
          status: 'EXECUTED'
        };

        setPortfolio({
          ...portfolio,
          cashBalance: newCash,
          realizedProfitLoss: newRealizedPL,
          holdings: updatedHoldings,
          transactions: [newTransaction, ...transactions]
        });

        addToast('success', 'Order Executed', `Sold ${shares} shares of ${stock.symbol}. Realized P&L: ₹${realizedGain.toFixed(2)}.`);
        setTradeModal({ isOpen: false, mode: 'SELL', stock: null });
      };

      const handleToggleWatchlist = (symbol) => {
        const isPresent = watchlist.includes(symbol);
        const updated = isPresent ? watchlist.filter(s => s !== symbol) : [...watchlist, symbol];
        setPortfolio({ ...portfolio, watchlist: updated });
        addToast('info', isPresent ? 'Removed from Watchlist' : 'Saved to Watchlist', `${symbol} updated.`);
      };

      // Export CSV
      const exportCSV = (data, filename, isTransactions = true) => {
        if (!data || data.length === 0) { alert('No data to export.'); return; }
        let headers, rows;
        if (isTransactions) {
          headers = ['Transaction ID', 'Date', 'Symbol', 'Company', 'Type', 'Shares', 'Price', 'Fees', 'Total Amount', 'Status'];
          rows = data.map(t => [t.id, t.date, t.symbol, `"${t.name}"`, t.type, t.shares, t.price, t.fees, t.totalAmount, t.status]);
        } else {
          headers = ['Symbol', 'Company', 'Shares', 'Avg Buy Price', 'Current Price', 'Invested', 'Current Value', 'Unrealized PL'];
          rows = data.map(h => {
            const s = STOCK_MAP[h.symbol] || { price: h.avgPurchasePrice };
            const v = h.shares * s.price;
            const inv = h.totalCostBasis || (h.shares * h.avgPurchasePrice);
            return [h.symbol, `"${h.name}"`, h.shares, h.avgPurchasePrice, s.price, inv, v, v - inv];
          });
        }
        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;

                          const rangePct = Math.min(100, Math.max(0, ((stock.price - low) / (high - low)) * 100));

                          return (
                            <tr key={stock.symbol} onClick={() => setDetailStock(stock)} className="table-row-hover">
                              <td
                                style={{ textAlign: 'center', cursor: 'pointer' }}
                                onClick={e => { e.stopPropagation(); handleToggleWatchlist(stock.symbol); }}
                              >
                                <span className={`star-icon ${isSaved ? 'star-active' : ''}`}>{isSaved ? '★' : '☆'}</span>
                              </td>
                              <td>
                                <div className="symbol-cell">
                                  <span className="stock-ticker">{stock.symbol}</span>
                                  <span className="stock-company-name">{stock.name}</span>
                                </div>
                              </td>
                              <td><span className="sector-tag">{stock.sector}</span></td>
                              <td style={{ textAlign: 'right' }} className="tabular-num font-semibold">{formatCurrency(stock.price, currency)}</td>
                              <td style={{ textAlign: 'right' }}>
                                <span className={`delta-tag ${isPos ? 'delta-pos' : 'delta-neg'}`}>
                                  {isPos ? '▲ +' : '▼ '}{formatPercent(stock.changePercent)}
                                </span>
                              </td>
                              <td>
                                <div className="range-bar-wrap">
                                  <div className="range-bar-track"><div className="range-bar-indicator" style={{ left: `${rangePct}%` }} /></div>
                                  <div className="range-bar-labels">
                                    <span>L: ₹{low.toFixed(0)}</span>
                                    <span>H: ₹{high.toFixed(0)}</span>
                                  </div>
                                </div>
                              </td>
                              <td style={{ textAlign: 'right' }} className="tabular-num text-secondary">{stock.marketCap}</td>
                              <td style={{ textAlign: 'right' }} className="tabular-num text-secondary">{stock.peRatio || '—'}</td>
                              <td style={{ textAlign: 'center' }} onClick={e => e.stopPropagation()}>
                                <div className="table-actions">
                                  <button onClick={() => setTradeModal({ isOpen: true, mode: 'BUY', stock })} className="btn-action btn-buy">Buy</button>
                                  {sharesOwned > 0 && (
                                    <button onClick={() => setTradeModal({ isOpen: true, mode: 'SELL', stock })} className="btn-action btn-sell">Sell ({sharesOwned})</button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 4: INSIGHTS */}
            {currentPage === 'insights' && (
              <div className="page-content">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">INVESTMENT INSIGHTS & LEARNING</h2>
                    <span className="section-sub">Portfolio diagnostics, risk alerts, and financial education</span>
                  </div>
                </div>

                <div className="panel" style={{ marginBottom: '1.25rem' }}>
                  <div className="panel-header">
                    <div>
                      <h3 className="panel-title">PORTFOLIO DIAGNOSTICS</h3>
                      <span className="panel-sub">Real-time risk evaluation from your active holdings</span>
                    </div>
                  </div>
                  <div className="diagnostics-list">
                    <div className="diagnostic-card diagnostic-info">
                      <div className="diagnostic-header">
                        <span className="diagnostic-tag">STATUS</span>
                        <span className="diagnostic-title">Asset Allocation Analyzed</span>
                      </div>
                      <p className="diagnostic-text">
                        You have {holdings.length} active stock positions with {formatCurrency(cashBalance, currency)} in liquid cash. Your diversification score is sound.
                      </p>
                    </div>
                  </div>
                </div>

                <div className="panel" style={{ marginBottom: '1.25rem' }}>
                  <div className="panel-header">
                    <div>
                      <h3 className="panel-title">EDUCATIONAL ARTICLES</h3>
                      <span className="panel-sub">Equity fundamentals and risk management</span>
                    </div>
                  </div>
                  <div className="articles-grid">
                    {LEARNING_ARTICLES.map(art => (
                      <div key={art.id} className="article-card">
                        <div className="article-meta">
                          <span className="category-tag">{art.category}</span>
                          <span className="read-time">{art.readTime}</span>
                        </div>
                        <h4 className="article-title">{art.title}</h4>
                        <p className="article-summary">{art.summary}</p>
                        <div className="article-footer">
                          <span className="difficulty-badge">Level: {art.difficulty}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="panel">
                  <div className="panel-header">
                    <div>
                      <h3 className="panel-title">DAILY INVESTMENT WISDOM</h3>
                      <span className="panel-sub">Practical rules of thumb from renowned investors</span>
                    </div>
                  </div>
                  <div className="tips-list">
                    {INVESTMENT_TIPS.map(tip => (
                      <div key={tip.id} className="tip-row">
                        <div className="tip-content">
                          <div className="tip-tags">
                            <span className="tip-category">{tip.category}</span>
                            <span className="tip-tagline">{tip.tagline}</span>
                          </div>
                          <div className="tip-title">{tip.title}</div>
                          <p className="tip-body">{tip.tip}</p>
                          <div className="tip-takeaway"><strong>Rule:</strong> {tip.practicalTakeaway}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 5: TRANSACTIONS */}
            {currentPage === 'transactions' && (
              <div className="page-content">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">TRANSACTION HISTORY & AUDIT LEDGER</h2>
                    <span className="section-sub">Immutable record of simulated orders, timestamps, and fees</span>
                  </div>
                </div>

                <div className="stat-grid-4">
                  <div className="stat-card">
                    <div className="stat-card-header"><span className="stat-title">Total Orders</span></div>
                    <div className="stat-card-body"><div className="stat-value">{transactions.length}</div></div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-card-header"><span className="stat-title">Buy Orders</span></div>
                    <div className="stat-card-body"><div className="stat-value">{transactions.filter(t => t.type === 'BUY').length}</div></div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-card-header"><span className="stat-title">Sell Orders</span></div>
                    <div className="stat-card-body"><div className="stat-value">{transactions.filter(t => t.type === 'SELL').length}</div></div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-card-header"><span className="stat-title">Realized P&L</span></div>
                    <div className="stat-card-body">
                      <div className="stat-value" style={{ color: realizedProfitLoss >= 0 ? 'var(--profit-color)' : 'var(--loss-color)' }}>
                        {realizedProfitLoss >= 0 ? '+' : ''}{formatCurrency(realizedProfitLoss, currency)}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="panel">
                  <div className="table-toolbar">
                    <div className="filter-pill-group">
                      <button className="filter-pill active">All Orders ({transactions.length})</button>
                    </div>
                    <button onClick={() => exportCSV(transactions, `stockwise_transactions_${new Date().toISOString().split('T')[0]}.csv`, true)} className="btn-secondary btn-sm" disabled={transactions.length === 0}>
                      Export Ledger (CSV)
                    </button>
                  </div>

                  <div className="table-responsive">
                    <table className="financial-table">
                      <thead>
                        <tr>
                          <th>TXN ID</th>
                          <th>DATE & TIME</th>
                          <th>ORDER TYPE</th>
                          <th>COMPANY & TICKER</th>
                          <th style={{ textAlign: 'right' }}>SHARES</th>
                          <th style={{ textAlign: 'right' }}>EXEC. PRICE</th>
                          <th style={{ textAlign: 'right' }}>FEES</th>
                          <th style={{ textAlign: 'right' }}>NET AMOUNT</th>
                          <th style={{ textAlign: 'center' }}>STATUS</th>
                        </tr>
                      </thead>
                      <tbody>
                        {transactions.map(txn => (
                          <tr key={txn.id} className="table-row-hover">
                            <td className="tabular-num text-muted font-mono">{txn.id}</td>
                            <td className="text-secondary" style={{ fontSize: '0.8rem' }}>{formatDate(txn.date)}</td>
                            <td>
                              <span className={`order-badge ${txn.type === 'BUY' ? 'order-buy' : 'order-sell'}`}>{txn.type}</span>
                            </td>
                            <td>
                              <div className="symbol-cell">
                                <span className="stock-ticker">{txn.symbol}</span>
                                <span className="stock-company-name">{txn.name}</span>
                              </div>
                            </td>
                            <td style={{ textAlign: 'right' }} className="tabular-num font-semibold">{txn.shares}</td>
                            <td style={{ textAlign: 'right' }} className="tabular-num">{formatCurrency(txn.price, currency)}</td>
                            <td style={{ textAlign: 'right' }} className="tabular-num text-muted">{formatCurrency(txn.fees, currency)}</td>
                            <td style={{ textAlign: 'right' }} className="tabular-num font-bold">{formatCurrency(txn.totalAmount, currency)}</td>
                            <td style={{ textAlign: 'center' }}><span className="status-executed-tag">{txn.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 6: SETTINGS */}
            {currentPage === 'settings' && (
              <div className="page-content" style={{ maxWidth: '850px' }}>
                <div className="section-header">
                  <div>
                    <h2 className="section-title">PLATFORM SETTINGS</h2>
                    <span className="section-sub">Display preferences, currency formatting, and portfolio data controls</span>
                  </div>
                </div>

                <div className="settings-stack">
                  <div className="panel">
                    <div className="panel-header">
                      <div><h3 className="panel-title">USER PROFILE & SIMULATION ACCOUNT</h3></div>
                    </div>
                    <div className="settings-grid-3">
                      <div className="settings-field">
                        <span className="field-label">INVESTOR NAME</span>
                        <span className="field-value">Alex Sharma</span>
                      </div>
                      <div className="settings-field">
                        <span className="field-label">EMAIL ADDRESS</span>
                        <span className="field-value">alex.sharma@stockwise.demo</span>
                      </div>
                      <div className="settings-field">
                        <span className="field-label">ACCOUNT TYPE</span>
                        <span className="field-value"><span className="badge-demo">Academic Simulator</span></span>
                      </div>
                    </div>
                  </div>

                  <div className="panel">
                    <div className="panel-header">
                      <div><h3 className="panel-title">DISPLAY & FORMATTING</h3></div>
                    </div>
                    <div className="settings-rows">
                      <div className="settings-row">
                        <div>
                          <div className="setting-name">Interface Theme</div>
                          <div className="setting-desc">Clean white financial research theme or dark navy mode</div>
                        </div>
                        <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="btn-secondary btn-sm">
                          {theme === 'dark' ? '☀️ Switch to Light' : '🌙 Switch to Dark'}
                        </button>
                      </div>
                      <div className="settings-row">
                        <div>
                          <div className="setting-name">Display Currency</div>
                          <div className="setting-desc">Indian Rupee (₹ INR) or US Dollar ($ USD)</div>
                        </div>
                        <button onClick={() => setCurrency(currency === 'INR' ? 'USD' : 'INR')} className="btn-secondary btn-sm">
                          {currency === 'INR' ? '₹ INR (Indian Rupee)' : '$ USD (US Dollar)'}
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="panel">
                    <div className="panel-header">
                      <div><h3 className="panel-title">PORTFOLIO DATA & BACKUP</h3></div>
                    </div>
                    <div className="settings-rows">
                      <div className="settings-row">
                        <div>
                          <div className="setting-name">Restore Demo Starter Portfolio</div>
                          <div className="setting-desc">Resets to curated starter portfolio (4 active holdings, ₹24,675 cash)</div>
                        </div>
                        <button onClick={() => setResetModal('demo')} className="btn-secondary btn-sm">↺ Restore Demo Seed</button>
                      </div>
                      <div className="settings-row destructive-row">
                        <div>
                          <div className="setting-name text-danger">Reset to Fresh ₹1,00,000 Cash</div>
                          <div className="setting-desc">Wipes active holdings and transaction history</div>
                        </div>
                        <button onClick={() => setResetModal('clean')} className="btn-danger btn-sm">⚠ Reset to Cash Only</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 4. FOOTER */}
          <footer className="site-footer">
            <div className="footer-inner">
              <div className="footer-left">
                <span className="footer-brand font-semibold">StockWise</span>
                <span className="footer-desc">· Indian Stock Market Portfolio Simulator & Research Platform</span>
              </div>
              <div className="footer-right">
                <span className="footer-note">Simulated Market Data for Academic Evaluation</span>
              </div>
            </div>
          </footer>

          {/* 5. BUY / SELL MODAL */}
          {tradeModal.isOpen && tradeModal.stock && (
            <div className="modal-backdrop" onClick={() => setTradeModal({ isOpen: false, mode: 'BUY', stock: null })}>
              <div className="modal-dialog" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <div className="modal-title-wrap">
                    <span className={`modal-badge ${tradeModal.mode === 'BUY' ? 'order-buy' : 'order-sell'}`}>
                      SIMULATED {tradeModal.mode} ORDER
                    </span>
                    <div className="modal-stock-title">
                      <span className="stock-ticker">{tradeModal.stock.symbol}</span>
                      <span className="stock-company-name">· {tradeModal.stock.name}</span>
                    </div>
                  </div>
                  <button className="modal-close-btn" onClick={() => setTradeModal({ isOpen: false, mode: 'BUY', stock: null })}>✕</button>
                </div>

                <div className="modal-body">
                  <div className="price-banner">
                    <div className="price-banner-item">
                      <span className="price-banner-label">MARKET PRICE</span>
                      <span className="price-banner-val">{formatCurrency(tradeModal.stock.price, currency)}</span>
                    </div>
                    <div className="price-banner-item">
                      <span className="price-banner-label">{tradeModal.mode === 'BUY' ? 'AVAILABLE CASH' : 'OWNED SHARES'}</span>
                      <span className="price-banner-val">
                        {tradeModal.mode === 'BUY' ? formatCurrency(cashBalance, currency) : `${holdingsMap[tradeModal.stock.symbol]?.shares || 0} Shares`}
                      </span>
                    </div>
                  </div>

                  <form onSubmit={e => {
                    e.preventDefault();
                    const qty = parseInt(e.target.shares.value, 10) || 1;
                    if (tradeModal.mode === 'BUY') {
                      handleExecuteBuy(tradeModal.stock, qty);
                    } else {
                      handleExecuteSell(tradeModal.stock, qty);
                    }
                  }}>
                    <div className="form-group">
                      <label className="form-label">Number of Shares:</label>
                      <div className="share-input-wrap">
                        <input type="number" name="shares" min="1" defaultValue="5" className="input-shares" required autoFocus />
                        <span className="share-input-suffix">Shares</span>
                      </div>
                    </div>

                    <div className="order-summary-box">
                      <div className="summary-row">
                        <span>Simulated Exchange Fee</span>
                        <span className="tabular-num text-muted">+₹20.00</span>
                      </div>
                    </div>

                    <div className="modal-footer">
                      <button type="button" className="btn-secondary" onClick={() => setTradeModal({ isOpen: false, mode: 'BUY', stock: null })}>Cancel</button>
                      <button type="submit" className={`btn-primary ${tradeModal.mode === 'SELL' ? 'btn-sell-primary' : ''}`}>
                        Confirm & Place Order
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* 6. RESET CONFIRMATION MODAL */}
          {resetModal && (
            <div className="modal-backdrop" onClick={() => setResetModal(null)}>
              <div className="modal-dialog" onClick={e => e.stopPropagation()} style={{ maxWidth: '440px' }}>
                <div className="modal-header">
                  <h3 className="modal-title">{resetModal === 'demo' ? 'Restore Demo Portfolio?' : 'Reset to ₹1,00,000 Cash?'}</h3>
                  <button className="modal-close-btn" onClick={() => setResetModal(null)}>✕</button>
                </div>
                <div className="modal-body">
                  <p style={{ fontSize: '0.88rem', color: 'var(--text-secondary)', lineHeight: 1.5 }}>
                    {resetModal === 'demo'
                      ? 'This will restore the standard evaluation demo portfolio with 4 active stocks and sample trade history.'
                      : 'This will completely erase all current stock holdings and reset your cash balance to ₹1,00,000.00.'}
                  </p>
                </div>
                <div className="modal-footer">
                  <button className="btn-secondary" onClick={() => setResetModal(null)}>Cancel</button>
                  <button
                    className={resetModal === 'demo' ? 'btn-primary' : 'btn-danger'}
                    onClick={() => {
                      if (resetModal === 'demo') {
                        setPortfolio(INITIAL_PORTFOLIO);
                        addToast('info', 'Demo Restored', 'Starter portfolio restored.');
                      } else {
                        setPortfolio({
                          cashBalance: 100000.00,
                          initialCapital: 100000.00,
                          realizedProfitLoss: 0.00,
                          holdings: [],
                          transactions: [],
                          watchlist: ['RELIANCE', 'TCS', 'INFY']
                        });
                        addToast('info', 'Clean Slate', 'Reset to fresh ₹100,000 cash.');
                      }
                      setResetModal(null);
                    }}
                  >
                    Confirm
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 7. TOASTS */}
          <div className="toast-box">
            {toasts.map(t => (
              <div key={t.id} className={`toast-notification toast-${t.type}`}>
                <div className="toast-title">{t.title}</div>
                <div className="toast-msg">{t.message}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
